<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adenai Map</title>
  <meta property="og:title" content="Adenai Map – DnD Kampagne VsuzH">
  <meta property="og:description" content="Karte der Welt Adenai, mit dem Abenteuerpfad der Gruppe VsuzH.">
  <meta property="og:image" content="public/icons/uwu_1.png">
  
  <link rel="icon" type="image/png" href="public/icons/uwu_1.png">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="src/vendor/leaflet/leaflet.css" />
  <!-- My styles CSS (now includes character panel styles) -->
  <link rel="stylesheet" href="public/css/styles.css?v=7">
  <!-- Feature-specific CSS -->
  <link rel="stylesheet" href="public/css/components/features/gallery.css?v=6">
  <!-- Map System CSS -->
  <link rel="stylesheet" href="public/css/components/map/map-core.css?v=6">
  <link rel="stylesheet" href="public/css/components/map/coordinates.css?v=6">
  <!-- Character System CSS -->
  <link rel="stylesheet" href="public/css/components/characters/character-paths.css?v=6">
  <link rel="stylesheet" href="public/css/components/characters/character-panel.css?v=7">
  <link rel="stylesheet" href="public/css/components/characters/character-system.css?v=6">
  <!-- Movement System CSS -->
  <link rel="stylesheet" href="public/css/components/movement/movement-markers.css?v=6">
  <!-- UI Components CSS -->
  <link rel="stylesheet" href="public/css/components/ui/controls.css?v=6">
  <link rel="stylesheet" href="public/css/components/ui/modals.css?v=6">
  <link rel="stylesheet" href="public/css/components/ui/popups.css?v=10">
  <link rel="stylesheet" href="public/css/components/ui/badges.css?v=6">
  <!-- Feature CSS -->
  <link rel="stylesheet" href="public/css/components/features/search.css?v=8">
  <link rel="stylesheet" href="public/css/components/features/protocols.css?v=21">
  <link rel="stylesheet" href="public/css/layout/mobile.css?v=7">
</head>

<body>
  <div id="map"></div>
  
  <!-- Dragon Shadow Overlay -->
  <div class="dragon-shadow-overlay">
    <div class="dragon-shadow"></div>
    <div class="dragon-shadow variant-2"></div>
    <div class="dragon-shadow variant-3"></div>
  </div>
  
  <div id="coords">X: –, Y: –</div>
  
  <!-- Map Controls -->
  <div id="map-controls">
    <button id="toggle-movement-markers" class="map-control-btn" title="Toggle Movement Markers">
      <div class="cluster-marker-button">
        <div class="cluster-marker-visual">
          <div class="cluster-dot">
            <span class="cluster-count">1x</span>
          </div>
          <div class="location-indicator">
            <span class="location-count">1</span>
          </div>
        </div>
        <div class="cluster-status-text">On</div>
      </div>
    </button>
  </div>
  
  <!-- Version indicator (populated by github-version.js) -->
  <div id="version-info">
    <!-- Auto-populated by GitHub Version Checker -->
  </div>

  <!-- Search Container -->
  <div id="search-container">
    <input type="text" id="searchBox" placeholder="Begriff suchen..." />
    <div id="resultsDropdown"></div>
  </div>

  <!-- Character Panel -->
  <div id="character-panel" class="character-panel">
    <div class="resize-handle" id="resize-handle"></div>
    
    <div class="panel-header">
      <h3>Pfade der Charaktere</h3>
    </div>
    
    <div class="panel-content">
      <!-- Movement controls and search bar will be injected here by JavaScript -->
      
      <div class="character-grid" id="character-grid">
          <!-- Character cards will be populated here by JavaScript -->
      </div>
    </div>
  </div>

  <!-- No JavaScript fallback -->
  <noscript>
    <div style="
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #222;
      color: #f1e1bd;
      padding: 20px;
      font-family: sans-serif;
      border-radius: 8px;
      z-index: 2000;
      text-align: center;">
      Diese Karte benötigt JavaScript. Bitte aktiviere JavaScript in deinem Browser, um sie anzuzeigen.
    </div>
  </noscript>
  
  <!-- STEP 0: External Dependencies (CMS API) -->
  <script src="src/core/config.js?t=v1.2"></script>
  
  <!-- STEP 1: External Dependencies (Core Libraries) -->
  <script src="src/vendor/leaflet/leaflet.js"></script>
  <script src="src/vendor/leaflet.curve.js"></script>
  <script src="src/vendor/leaflet.polylineDecorator.min.js"></script>

  <!-- STEP 2: Gallery System -->
  <script src="src/vendor/panzoom.min.js"></script>
  <script src="src/ui/gallery.js"></script>

  <!-- STEP 3: Core Map System (MUST load first) -->
  <script src="src/core/map-core.js?t=v1.7"></script>

  <!-- STEP 4: Utility Libraries (before other systems) -->
  <script src="src/utils/logger.js?t=v1.1"></script>
  <script src="src/utils/rich-text.js?t=v1.5"></script>
  <script src="src/utils/emotes.js?t=v1.2"></script>
  <script src="src/utils/date-field.js?t=v1.0"></script>
  <script src="src/utils/panel-resize.js?t=v1.0"></script>
  <script src="src/utils/wiki-links.js?t=v1.7"></script>
  <script src="src/ui/components/link-cards.js?t=v1.0"></script>
  <script src="src/utils/entity-images.js?t=v1.0"></script>
  <script src="src/utils/http-utils.js?t=v1.1"></script>
  <script src="src/utils/map-utils.js?t=v1.1"></script>
  <script src="src/utils/event-utils.js?t=v1.1"></script>
  <script src="src/utils/notification-utils.js?t=v1.1"></script>
  <script src="src/utils/performance-utils.js?t=v1.1"></script>
  <script src="src/utils/memory-utils.js?t=v1.2"></script>
  <script src="src/utils/state-manager.js?t=v1.1"></script>
  <!-- 🚀 NEW: Advanced Loading & Caching -->
  <script src="src/utils/data-config.js?t=v1.2"></script>
  <script src="src/utils/advanced-loader.js?t=v1.3"></script>
  <script src="src/utils/data-manager.js?t=v1.2"></script>
  <script src="src/utils/sw-manager.js?t=v1.2"></script>
  <script src="src/utils/coordinate-utils.js?t=v1.1"></script>
  <script src="src/utils/data-utils.js?t=v1.1"></script>
  <script src="src/utils/icons.js?t=v1.1"></script>
  <script src="src/utils/image-hover-preview.js?t=v1.4"></script>

  <!-- STEP 5: Character Path API Client (utility layer) -->
  <script src="src/utils/char-path-api.js?t=v1.2"></script>

  <!-- STEP 6: Modern Adenai Systems (after map core and utilities) -->
  <script src="src/systems/character-system.js?t=v1.9"></script>
  <script src="src/ui/components/movement-markers.js?t=v1.2"></script>
  <script src="src/ui/components/timeline.js?t=v1.1"></script>
  <script src="src/ui/components/protocols.js?t=v1.27"></script>
  <script src="src/ui/components/glossary.js?t=v1.5"></script>
  <script src="src/systems/movement-system.js?t=v1.5"></script>
  <script src="src/systems/location-system.js?t=v1.3"></script>
  <script src="src/utils/search.js?t=v1.0"></script>
  <script src="src/systems/search-system.js?t=v1.8"></script>
  <script src="src/ui/components/character-panel.js?t=v1.8"></script>
  <script src="src/ui/components/map-controls.js?t=v1.2"></script>
  <!-- Enhanced Image Popup System -->
  <script src="src/ui/image-popup-manager.js?t=v1.3"></script>
  <!-- Timeline temporarily disabled -->
  <!-- <script src="src/ui/components/movement-timeline-optimized.js?t=v1.2"></script> -->

  <!-- STEP 5.5: Coordinate Copy System -->
  <script src="src/ui/components/coordinate-copy.js?t=v1.2"></script>

  <!-- STEP 5.6: GitHub Version Checker -->
  <script src="src/utils/github-version.js?t=v1.1"></script>

  <!-- STEP 7: Main Application (Last) -->
  <script src="src/core/main.js?t=v1.9"></script>

</html>
